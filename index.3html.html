<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotaOy — Баян Сұлу</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF9F0;
  --surface: #FFFFFF;
  --surface2: #FFF3E0;
  --primary: #FF6B35;
  --primary2: #FF8C5A;
  --secondary: #4ECDC4;
  --secondary2: #7EDDD8;
  --gold: #FFD700;
  --gold2: #FFA500;
  --purple: #9B59B6;
  --purple2: #C39BD3;
  --green: #27AE60;
  --green2: #58D68D;
  --blue: #2980B9;
  --blue2: #5DADE2;
  --red: #E74C3C;
  --border: #FFE0B2;
  --text: #2C3E50;
  --text2: #7F8C8D;
  --shadow: 0 4px 20px rgba(255,107,53,0.15);
  --shadow2: 0 8px 32px rgba(255,107,53,0.25);
  --legendary: #FFD700;
  --epic: #9B59B6;
  --rare: #2980B9;
  --common: #95A5A6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,107,53,0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(78,205,196,0.08) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255,215,0,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.stars-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.star {
  position: absolute; width: 8px; height: 8px; background: var(--gold);
  clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation: floatStar linear infinite; opacity: 0.4;
}
@keyframes floatStar {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.4; } 90% { opacity: 0.4; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
  z-index: 99; box-shadow: 0 4px 20px rgba(255,107,53,0.4);
}
.logo-text { font-family: 'Fredoka One', cursive; font-size: 24px; color: white; text-shadow: 2px 2px 0px rgba(0,0,0,0.15); letter-spacing: 1px; }
.logo-sub { font-size: 10px; color: rgba(255,255,255,0.8); display: block; margin-top: -2px; }
.coin-pill {
  background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5);
  border-radius: 30px; padding: 6px 14px; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px);
}
.coin-star { width: 22px; height: 22px; }
.coin-count { font-size: 16px; font-weight: 900; color: white; font-family: 'Fredoka One', cursive; }
.lang-bar { position: fixed; top: 66px; right: 12px; display: flex; gap: 4px; z-index: 98; }
.lang-btn {
  background: white; border: 2px solid var(--border); border-radius: 10px;
  padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer; transition: all 0.2s;
  font-family: 'Nunito', sans-serif; color: var(--text2);
}
.lang-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
.page { display: none; padding: 130px 16px 100px; position: relative; z-index: 1; min-height: 100vh; }
.page.active { display: block; }

/* WELCOME */
#page-welcome {
  padding: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; background: linear-gradient(160deg, #FF6B35 0%, #FF8C5A 30%, #FFD700 70%, #4ECDC4 100%); text-align: center;
}
#page-welcome.active { display: flex; }
.welcome-hero { margin-bottom: 32px; animation: bounceIn 0.8s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes bounceIn { from { transform: scale(0.3) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.welcome-title { font-family: 'Fredoka One', cursive; font-size: 52px; color: white; text-shadow: 4px 4px 0 rgba(0,0,0,0.15); margin-bottom: 8px; animation: slideDown 0.6s ease 0.2s both; }
.welcome-sub { font-size: 18px; color: rgba(255,255,255,0.9); margin-bottom: 40px; font-weight: 700; animation: slideDown 0.6s ease 0.4s both; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
.welcome-btn {
  background: white; color: var(--primary); border: none; border-radius: 30px; padding: 18px 48px;
  font-size: 22px; font-weight: 900; font-family: 'Fredoka One', cursive; cursor: pointer;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2); transition: all 0.2s; animation: slideUp 0.6s ease 0.6s both; letter-spacing: 1px;
}
.welcome-btn:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 16px 40px rgba(0,0,0,0.25); }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.cambot-svg { width: 160px; height: 160px; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.2)); }

/* ONBOARD */
#page-onboard {
  padding: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; background: linear-gradient(160deg, #4ECDC4, #FFD700 60%, #FF6B35); text-align: center;
}
#page-onboard.active { display: flex; }
.onboard-card { background: white; border-radius: 28px; padding: 36px 32px; max-width: 340px; width: 90%; box-shadow: 0 16px 48px rgba(0,0,0,0.15); }
.onboard-title { font-family: 'Fredoka One', cursive; font-size: 26px; color: var(--primary); margin-bottom: 20px; }
.fancy-input {
  width: 100%; background: var(--surface2); border: 3px solid var(--border); border-radius: 16px;
  padding: 14px 18px; font-size: 16px; font-family: 'Nunito', sans-serif; font-weight: 700;
  color: var(--text); outline: none; transition: border-color 0.2s; margin-bottom: 16px;
}
.fancy-input:focus { border-color: var(--primary); }
.age-grid { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.age-btn {
  width: 50px; height: 50px; border-radius: 14px; background: var(--surface2); border: 3px solid var(--border);
  font-size: 18px; font-weight: 900; cursor: pointer; transition: all 0.2s; font-family: 'Fredoka One', cursive; color: var(--text);
}
.age-btn.selected { background: var(--primary); border-color: var(--primary); color: white; transform: scale(1.1); }
.big-btn {
  background: linear-gradient(135deg, var(--primary), var(--primary2)); border: none; border-radius: 20px;
  padding: 16px 32px; font-size: 18px; font-weight: 900; color: white; cursor: pointer; width: 100%;
  font-family: 'Fredoka One', cursive; box-shadow: 0 6px 20px rgba(255,107,53,0.4); transition: all 0.2s; letter-spacing: 0.5px;
}
.big-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,53,0.5); }
.big-btn:active { transform: translateY(0); }

/* MENU */
#page-menu {
  padding: 130px 16px 100px;
}
.section-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: var(--text); margin-bottom: 4px; }
.section-sub { font-size: 14px; color: var(--text2); margin-bottom: 20px; font-weight: 600; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.game-card {
  background: white; border-radius: 22px; padding: 20px 14px; text-align: center; cursor: pointer;
  transition: all 0.25s; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border: 3px solid transparent;
  position: relative; overflow: hidden;
}
.game-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0) 60%, rgba(255,255,255,0.6)); }
.game-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 12px 32px rgba(0,0,0,0.15); }
.game-card.color-1 { border-color: #FF6B35; background: linear-gradient(135deg, #FFF5F2, white); }
.game-card.color-2 { border-color: #4ECDC4; background: linear-gradient(135deg, #F0FFFD, white); }
.game-card.color-3 { border-color: #9B59B6; background: linear-gradient(135deg, #FAF0FF, white); }
.game-card.color-4 { border-color: #27AE60; background: linear-gradient(135deg, #F0FFF7, white); }
.game-card.color-5 { border-color: #2980B9; background: linear-gradient(135deg, #F0F8FF, white); }
.game-card.color-6 { border-color: #E74C3C; background: linear-gradient(135deg, #FFF0F0, white); }
.game-icon-wrap { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.game-title-card { font-family: 'Fredoka One', cursive; font-size: 14px; margin-bottom: 4px; color: var(--text); }
.game-reward-tag { display: inline-block; background: var(--gold); color: #7a5000; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px; }

/* GAME PAGES */
.back-btn {
  display: flex; align-items: center; gap: 8px; background: white; border: 2px solid var(--border);
  border-radius: 14px; padding: 8px 16px; font-size: 14px; font-weight: 800; cursor: pointer;
  margin-bottom: 16px; color: var(--text); font-family: 'Nunito', sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.game-header {
  background: white; border-radius: 20px; padding: 16px 20px; display: flex; justify-content: space-around;
  margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.07);
}
.stat-chip { text-align: center; }
.stat-num { font-family: 'Fredoka One', cursive; font-size: 24px; color: var(--primary); display: block; }
.stat-lbl { font-size: 11px; color: var(--text2); font-weight: 700; }

/* MEMORY GAME */
.memory-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; max-width: 380px; margin: 0 auto; }
.mem-card { aspect-ratio: 1; border-radius: 16px; cursor: pointer; transition: all 0.3s; position: relative; background: linear-gradient(135deg, var(--secondary), var(--secondary2)); border: 3px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.mem-card.matched { background: linear-gradient(135deg, #ECFFF8, #D5F5E3); border-color: var(--green); }
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<div class="top-bar">
  <div>
    <div class="logo-text">🤖 BotaOy</div>
    <div class="logo-sub">Баян Сұлу</div>
  </div>
  <div class="coin-pill">
    <span class="coin-count" id="coinCount">0</span> 💰
  </div>
</div>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('kk', this)">KK</button>
  <button class="lang-btn" onclick="setLang('ru', this)">RU</button>
  <button class="lang-btn" onclick="setLang('en', this)">EN</button>
</div>

<!-- WELCOME PAGE -->
<div id="page-welcome" class="page active">
  <div class="welcome-hero">🤖</div>
  <h1 class="welcome-title">BotaOy</h1>
  <p class="welcome-sub">Баян Сұлу</p>
  <button class="welcome-btn" onclick="startGame()">Бастау</button>
</div>

<!-- ONBOARD PAGE -->
<div id="page-onboard" class="page">
  <div class="onboard-card">
    <h2 class="onboard-title">Сөйлесіңіз</h2>
    <input type="text" id="nameInput" class="fancy-input" placeholder="Атыңыз" maxlength="20">
    <button class="big-btn" onclick="nextStep()">Келесі</button>
  </div>
</div>

<!-- MENU PAGE -->
<div id="page-menu" class="page">
  <h2 class="section-title">Ойындар</h2>
  <p class="section-sub">Сіздің ойындарыңыз</p>
  
  <div class="menu-grid">
    <div class="game-card color-1" onclick="openGame('memory')">
      <div class="game-icon-wrap">🎮</div>
      <div class="game-title-card">Есте Сақтау</div>
      <span class="game-reward-tag">+100 💰</span>
    </div>
    <div class="game-card color-2" onclick="openGame('quiz')">
      <div class="game-icon-wrap">❓</div>
      <div class="game-title-card">Викторина</div>
      <span class="game-reward-tag">+100 💰</span>
    </div>
    <div class="game-card color-3" onclick="openGame('math')">
      <div class="game-icon-wrap">🔢</div>
      <div class="game-title-card">Математика</div>
      <span class="game-reward-tag">+100 💰</span>
    </div>
    <div class="game-card color-4" onclick="openGame('word')">
      <div class="game-icon-wrap">📝</div>
      <div class="game-title-card">Сөздер</div>
      <span class="game-reward-tag">+100 💰</span>
    </div>
  </div>
</div>

<!-- MEMORY GAME PAGE -->
<div id="page-memory" class="page">
  <button class="back-btn" onclick="goBack()">← Артқа</button>
  <div class="game-header">
    <div class="stat-chip">
      <span class="stat-num" id="memoryScore">0</span>
      <div class="stat-lbl">Ұпай</div>
    </div>
  </div>
  <div class="memory-grid" id="memoryGrid"></div>
</div>

<!-- QUIZ PAGE -->
<div id="page-quiz" class="page">
  <button class="back-btn" onclick="goBack()">← Артқа</button>
  <div class="game-header">
    <div class="stat-chip">
      <span class="stat-num" id="quizScore">0</span>
      <div class="stat-lbl">Дұрыс</div>
    </div>
  </div>
  <div id="quizContent"></div>
</div>

<!-- MATH PAGE -->
<div id="page-math" class="page">
  <button class="back-btn" onclick="goBack()">← Артқа</button>
  <div class="game-header">
    <div class="stat-chip">
      <span class="stat-num" id="mathScore">0</span>
      <div class="stat-lbl">Дұрыс</div>
    </div>
  </div>
  <div id="mathContent"></div>
</div>

<!-- WORD PAGE -->
<div id="page-word" class="page">
  <button class="back-btn" onclick="goBack()">← Артқа</button>
  <div class="game-header">
    <div class="stat-chip">
      <span class="stat-num" id="wordScore">0</span>
      <div class="stat-lbl">Ұпай</div>
    </div>
  </div>
  <div id="wordContent"></div>
</div>

<script>
// GLOBAL STATE
let state = {
  coins: 0,
  name: '',
  age: 0,
  language: 'kk'
};

let currentLang = 'kk';
let currentGame = null;
let gameScores = { memory: 0, quiz: 0, math: 0, word: 0 };

// TRANSLATIONS
const T = {
  kk: {
    start: 'Бастау',
    next: 'Келесі',
    back: 'Артқа',
    games: 'Ойындар',
    memory: 'Есте Сақтау',
    quiz: 'Викторина',
    math: 'Математика',
    word: 'Сөздер'
  },
  ru: {
    start: 'Начать',
    next: 'Далее',
    back: 'Назад',
    games: 'Игры',
    memory: 'Память',
    quiz: 'Викторина',
    math: 'Математика',
    word: 'Слова'
  },
  en: {
    start: 'Start',
    next: 'Next',
    back: 'Back',
    games: 'Games',
    memory: 'Memory',
    quiz: 'Quiz',
    math: 'Math',
    word: 'Words'
  }
};

// UTILITY FUNCTIONS
function t(key) {
  return (T[currentLang] || T.kk)[key] || key;
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
}

function setLang(lang, btn) {
  currentLang = lang;
  state.language = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  save();
}

function save() {
  try {
    localStorage.setItem('botaoy_v3', JSON.stringify(state));
  } catch(e) {}
}

function load() {
  try {
    const data = localStorage.getItem('botaoy_v3');
    if (data) {
      state = JSON.parse(data);
      currentLang = state.language || 'kk';
      document.getElementById('coinCount').textContent = state.coins;
    }
  } catch(e) {}
}

function updateCoins(amount) {
  state.coins += amount;
  document.getElementById('coinCount').textContent = state.coins;
  save();
}

// PAGE NAVIGATION
function startGame() {
  switchPage('onboard');
}

function nextStep() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) {
    alert('Аты енгізіңіз');
    return;
  }
  state.name = name;
  save();
  switchPage('menu');
}

function goBack() {
  switchPage('menu');
}

function openGame(name) {
  currentGame = name;
  gameScores[name] = 0;
  
  if (name === 'memory') {
    initMemory();
    switchPage('memory');
  } else if (name === 'quiz') {
    initQuiz();
    switchPage('quiz');
  } else if (name === 'math') {
    initMath();
    switchPage('math');
  } else if (name === 'word') {
    initWord();
    switchPage('word');
  }
}

// MEMORY GAME
function initMemory() {
  const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
  const cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
  
  const grid = document.getElementById('memoryGrid');
  grid.innerHTML = '';
  
  let flipped = [];
  let matched = 0;
  
  cards.forEach((emoji, idx) => {
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.textContent = '?';
    card.onclick = () => {
      if (flipped.length < 2 && !card.classList.contains('matched')) {
        card.textContent = emoji;
        flipped.push({ card, emoji, idx });
        
        if (flipped.length === 2) {
          if (flipped[0].emoji === flipped[1].emoji) {
            flipped[0].card.classList.add('matched');
            flipped[1].card.classList.add('matched');
            matched++;
            gameScores.memory += 10;
            document.getElementById('memoryScore').textContent = gameScores.memory;
            if (matched === emojis.length) {
              updateCoins(50);
              alert('Құттықтаймыз! Сіз жеңдіңіз!');
              goBack();
            }
          } else {
            setTimeout(() => {
              flipped[0].card.textContent = '?';
              flipped[1].card.textContent = '?';
            }, 1000);
          }
          flipped = [];
        }
      }
    };
    grid.appendChild(card);
  });
}

// QUIZ GAME
function initQuiz() {
  const questions = [
    { q: 'Қазақстанның астанасы қайсы?', options: ['Астана', 'Алматы', 'Қарағанды'], a: 0 },
    { q: '2 + 2 = ?', options: ['3', '4', '5'], a: 1 },
    { q: 'Ең ұзын өзен?', options: ['Іле', 'Сыр', 'Ертіс'], a: 2 }
  ];
  
  let qIdx = 0;
  
  function showQ() {
    if (qIdx >= questions.length) {
      updateCoins(30);
      alert('Викторина аяқталды! Ұпай: ' + gameScores.quiz);
      goBack();
      return;
    }
    
    const q = questions[qIdx];
    const content = document.getElementById('quizContent');
    content.innerHTML = `
      <div style="background: white; border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
        <p style="font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 20px;">${q.q}</p>
        <div style="display: grid; gap: 10px;">
          ${q.options.map((opt, i) => `
            <button style="background: white; border: 3px solid var(--border); border-radius: 16px; padding: 14px 18px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; transition: all 0.2s;" onclick="answerQ(${i}, ${q.a})">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  window.answerQ = (sel, correct) => {
    if (sel === correct) {
      gameScores.quiz += 10;
      document.getElementById('quizScore').textContent = gameScores.quiz;
    }
    qIdx++;
    showQ();
  };
  
  showQ();
}

// MATH GAME
function initMath() {
  let qIdx = 0;
  const questions = [];
  for (let i = 0; i < 5; i++) {
    const a = Math.floor(Math.random() * 10) + 1;
    const b = Math.floor(Math.random() * 10) + 1;
    const op = ['+', '-', '*'][Math.floor(Math.random() * 3)];
    let ans = op === '+' ? a + b : op === '-' ? a - b : a * b;
    questions.push({ q: `${a} ${op} ${b}`, a: ans });
  }
  
  function showQ() {
    if (qIdx >= questions.length) {
      updateCoins(30);
      alert('Математика аяқталды!');
      goBack();
      return;
    }
    
    const q = questions[qIdx];
    const opts = [q.a, q.a + Math.floor(Math.random() * 5) - 2, q.a + Math.floor(Math.random() * 5) + 3].sort();
    
    const content = document.getElementById('mathContent');
    content.innerHTML = `
      <div style="background: white; border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
        <p style="font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 20px;">${q.q}</p>
        <div style="display: grid; gap: 10px;">
          ${opts.map(opt => `
            <button style="background: white; border: 3px solid var(--border); border-radius: 16px; padding: 14px 18px; font-size: 15px; font-weight: 700; cursor: pointer;" onclick="answerM(${opt}, ${q.a})">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  window.answerM = (sel, correct) => {
    if (sel === correct) {
      gameScores.math += 10;
      document.getElementById('mathScore').textContent = gameScores.math;
    }
    qIdx++;
    showQ();
  };
  
  showQ();
}

// WORD GAME
function initWord() {
  const words = ['ҚАЗАҚСТАН', 'КОМПЬЮТЕР', 'МЕКТЕП', 'ДОСТАР', 'ОЙЫН'];
  let wIdx = 0;
  
  function showWord() {
    if (wIdx >= words.length) {
      updateCoins(40);
      alert('Сөздер аяқталды!');
      goBack();
      return;
    }
    
    const word = words[wIdx];
    const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
    
    const content = document.getElementById('wordContent');
    content.innerHTML = `
      <div style="background: white; border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
        <p style="font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 20px;">Сөзді табыңыз:</p>
        <p style="font-size: 28px; font-weight: 900; color: var(--primary); margin-bottom: 20px; letter-spacing: 3px;">${scrambled}</p>
        <input type="text" id="wordInput" style="width: 100%; padding: 14px; border: 3px solid var(--border); border-radius: 16px; font-size: 16px; font-weight: 700; margin-bottom: 10px;" placeholder="Жауабын енгізіңіз">
        <button style="width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary2)); border: none; border-radius: 20px; padding: 16px; font-size: 18px; font-weight: 900; color: white; cursor: pointer;" onclick="checkWord('${word}')">Тексеру</button>
      </div>
    `;
    document.getElementById('wordInput').focus();
  }
  
  window.checkWord = (correct) => {
    const ans = document.getElementById('wordInput').value.toUpperCase().trim();
    if (ans === correct) {
      gameScores.word += 10;
      document.getElementById('wordScore').textContent = gameScores.word;
    }
    wIdx++;
    showWord();
  };
  
  showWord();
}

// INIT
window.addEventListener('DOMContentLoaded', () => {
  load();
  generateStars();
});

function generateStars() {
  const container = document.getElementById('starsBg');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 4 + 2) + 'px';
    star.style.height = star.style.width;
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    star.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(star);
  }
}
</script>
